<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>周边休闲度假推荐 - 一起去滇南</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Noto Sans SC","PingFang SC",sans-serif;background:#faf9f6;color:#333;line-height:1.7}
.hero{background:linear-gradient(135deg,#1a3a0a 0%,#2d5016 40%,#4a7c2e 100%);color:#fff;padding:4rem 2rem 3rem;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,#faf9f6)}
.hero h1{font-size:2.2rem;font-weight:700;margin-bottom:.5rem;letter-spacing:2px}
.hero p{font-size:1.05rem;opacity:.85;max-width:600px;margin:0 auto}
.hero .stats{display:flex;justify-content:center;gap:2rem;margin-top:1.5rem;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.15);padding:.5rem 1.2rem;border-radius:20px;font-size:.9rem}
.nav-bar{background:#fff;padding:.8rem 2rem;display:flex;gap:1rem;justify-content:center;border-bottom:1px solid #e8e6e1;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.nav-bar a{text-decoration:none;color:#555;padding:.4rem 1rem;border-radius:20px;font-size:.9rem;transition:all .2s}
.nav-bar a:hover{background:#f0f0f0}
.nav-bar a.active{background:#2d5016;color:#fff}
.container{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.category-section{margin-bottom:3rem}
.category-header{border-left:4px solid #2d5016;padding:.5rem 0 .5rem 1rem;margin-bottom:1.5rem}
.category-header h2{font-size:1.4rem;font-weight:700}
.category-header p{color:#888;font-size:.9rem}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.2rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card-img{height:180px;background:#f0ede6;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:1rem 1.2rem 1.2rem;flex:1;display:flex;flex-direction:column}
.card-body h3{font-size:1.05rem;font-weight:600;margin-bottom:.3rem;line-height:1.4}
.location{color:#e65100;font-size:.82rem;margin-bottom:.4rem}
.card-body p{color:#555;font-size:.88rem;line-height:1.6;flex:1;margin-bottom:.5rem}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.5rem}
.tag{background:#e8f5e9;color:#2d5016;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:500}
.source-link{color:#ff2442;font-size:.78rem;text-decoration:none;font-weight:500}
.source-link:hover{text-decoration:underline}
.footer{text-align:center;padding:2rem;color:#aaa;font-size:.82rem;border-top:1px solid #eee;margin-top:2rem}
@media(max-width:768px){.hero{padding:2.5rem 1rem 2rem}.hero h1{font-size:1.6rem}.card-grid{grid-template-columns:1fr}.container{padding:1rem}}
</style>
</head>
<body>
<div class="hero">
  <h1>&#x1F3D5;&#xFE0F; 周边休闲度假推荐</h1>
  <p>从小红书精选 20 个宝藏目的地，按地点分类整理，涵盖山海茶温泉。适合周末短途、亲子出游、错峰旅行。</p>
  <div class="stats">
    <span class="stat">&#x1F4CD; 20 个目的地</span>
    <span class="stat">&#x1F30D; 3 大区域</span>
    <span class="stat">&#x1F4C5; 2026.09 更新</span>
  </div>
</div>
<div class="nav-bar">
  <a href="#cat-福州周边">&#x1F3D4;&#xFE0F; 福州周边</a>
  <a href="#cat-江浙沪">&#x1F30A; 江浙沪</a>
  <a href="#cat-全国">&#x1F5FA;&#xFE0F; 全国</a>
</div>
<div class="container">
<!-- SECTIONS -->
</div>
<div class="footer">数据来源：小红书真实笔记整理 &middot; 一起去滇南 &middot; 2026</div>
<script>
document.querySelectorAll('.nav-bar a').forEach(function(a){a.addEventListener('click',function(){document.querySelectorAll('.nav-bar a').forEach(function(x){x.classList.remove('active')});this.classList.add('active')})});
</script>
</body>
</html>
