name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*.html,app.js,src/*,styles.css,diannan-images/*"
          target: "/opt/1panel/www/sites/travel-together/index"
          strip_components: 0

      - name: Deploy Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "backend/*"
          target: "/opt/1panel/www/sites/travel-together/backend"
          strip_components: 1

      - name: Create Backend .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/1panel/www/sites/travel-together/backend
            cat > .env << 'ENVEOF'
            FLASK_SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }}
            SITE_ACCESS_TOKEN=${{ secrets.SITE_ACCESS_TOKEN }}
            FLASK_PORT=5000
            ENVEOF

      - name: Install Backend Dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/1panel/www/sites/travel-together/backend
            python3 -m pip install --user -r requirements.txt
            
            # 安装 systemd 服务（如果不存在）
            if [ ! -f /etc/systemd/system/travel-together-backend.service ]; then
              sudo cp travel-together-backend.service /etc/systemd/system/
              sudo systemctl daemon-reload
              sudo systemctl enable travel-together-backend
            fi
            
            sudo systemctl restart travel-together-backend
