<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f1e8" />
  <title>我的旅行项目</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f5f1e8;
      --paper-deep: #ebe5d8;
      --surface: #fffcf6;
      --ink: #21312d;
      --muted: #6f7871;
      --line: #dcd6c9;
      --green: #255f4d;
      --green-soft: #dce9de;
      --terracotta: #b75235;
      --sun: #e8b34b;
      --shadow: 0 12px 28px rgba(46, 54, 42, .08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { color: var(--ink); background: var(--paper); font-family: 'Noto Sans SC', sans-serif; min-height: 100vh; }
    button { cursor: pointer; font: inherit; }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,252,246,.93);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--green);
      border-radius: 50% 50% 42% 42%;
      font-family: 'Noto Serif SC', serif;
    }

    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 14px; }

    .button {
      min-height: 36px;
      padding: 0 13px;
      border-radius: 7px;
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
    }
    .button-ink { color: #fff; background: var(--ink); border-color: var(--ink); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 28px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .project-filter {
      display: inline-flex;
      gap: 4px;
      margin: -12px 0 24px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
    }

    .project-filter button {
      min-height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }

    .project-filter button.active { color: #fff; background: var(--green); }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .project-card h3 {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .project-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .project-status {
      flex: 0 0 auto;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .project-status.active { color: var(--green); background: var(--green-soft); }
    .project-status.completed { color: #657068; background: #e8ece8; }

    .project-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .project-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .project-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .project-stats {
      display: flex;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--green);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .empty-state h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 24px;
    }

    dialog {
      width: min(500px, calc(100vw - 32px));
      padding: 32px;
      border: 0;
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0,0,0,.22);
    }

    dialog::backdrop {
      background: rgba(33, 49, 45, 0.5);
    }

    dialog h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: var(--surface);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--green);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 28px;
    }

    .button-ghost {
      background: transparent;
      color: var(--ink);
    }

    .members-section {
      margin-bottom: 24px;
    }

    .members-section h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .members-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--paper);
      border-radius: 8px;
    }

    .member-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
    }

    .member-info {
      flex: 1;
    }

    .member-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .member-role {
      font-size: 12px;
      color: var(--muted);
    }

    .member-actions {
      display: flex;
      gap: 8px;
    }

    .member-actions select {
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }

    .member-actions button {
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      background: white;
      color: var(--terracotta);
    }

    .member-actions button:hover {
      background: var(--terracotta);
      color: white;
    }

    .invite-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .invite-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: var(--surface);
    }

    .project-card-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .project-card-actions button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      background: white;
    }

    .project-card-actions button:hover {
      background: var(--green-soft);
      border-color: var(--green);
    }

    @media (max-width: 760px) {
      .topbar { height: 62px; padding: 0 14px; }
      .container { padding: 24px 16px; }
      .page-header h1 { font-size: 22px; }
      .project-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="projects.html">
      <span class="brand-mark">南</span>
      <span>一起去滇南</span>
    </a>
    <div class="top-actions">
      <button class="button button-ink" id="create-btn">+ 新建项目</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>我的旅行项目</h1>
        <p>管理你的所有旅行计划</p>
      </div>
    </div>

    <div class="project-filter" aria-label="按旅程状态筛选">
      <button type="button" class="active" data-project-status="all">全部</button>
      <button type="button" data-project-status="active">进行中</button>
      <button type="button" data-project-status="completed">已完成</button>
    </div>

    <div id="projects-container"></div>
  </div>

  <dialog id="create-dialog">
    <h2>新建旅行项目</h2>
    <form id="create-form">
      <div class="form-group">
        <label for="project-name">项目名称 *</label>
        <input type="text" id="project-name" required placeholder="输入项目名称" autofocus />
      </div>
      <div class="form-group">
        <label for="project-mode">记录方式</label>
        <select id="project-mode">
          <option value="trip">旅行行程（按天安排）</option>
          <option value="hiking">徒步路线（整条路线）</option>
        </select>
      </div>
      <div class="dialog-actions">
        <button type="button" class="button button-ghost" id="cancel-btn">取消</button>
        <button type="submit" class="button button-ink">创建</button>
      </div>
    </form>
  </dialog>

  <dialog id="members-dialog">
    <h2>管理成员 - <span id="members-project-name"></span></h2>
    <div class="members-section">
      <h3>当前成员</h3>
      <div id="members-list" class="members-list"></div>
    </div>
    <div class="members-section">
      <h3>邀请新成员</h3>
      <div class="invite-form">
        <div class="form-group">
          <label for="invite-username">用户名</label>
          <input type="text" id="invite-username" placeholder="输入要邀请的用户名" />
        </div>
        <div class="form-group">
          <label for="invite-role">角色</label>
          <select id="invite-role">
            <option value="editor">编辑者</option>
            <option value="viewer">查看者</option>
            <option value="owner">所有者</option>
          </select>
        </div>
        <button class="button button-ink" id="invite-btn">邀请</button>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="button button-ghost" id="close-members-btn">关闭</button>
    </div>
  </dialog>

  <script type="module">
    // API 基础地址
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:5001'
      : window.location.origin;
    
    // 检查认证状态
    async function checkAuth() {
      try {
        const resp = await fetch(`${API_BASE}/api/auth/status`, {
          credentials: 'include'
        });
        const data = await resp.json();
        
        if (!data.authenticated) {
          window.location.href = 'login.html';
        }
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = 'login.html';
      }
    }
    
    // 加载项目列表
    async function loadProjects() {
      try {
        const resp = await fetch(`${API_BASE}/api/projects`, {
          credentials: 'include'
        });
        
        if (resp.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        
        const projects = await resp.json();
        renderProjects(projects);
      } catch (error) {
        console.error('Load projects failed:', error);
        projectsContainer.innerHTML = '<div class="empty-state">加载失败，请刷新重试</div>';
      }
    }
    
    // 创建项目
    async function createProject(projectData) {
      try {
        const resp = await fetch(`${API_BASE}/api/projects`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify(projectData)
        });
        
        if (resp.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        
        const project = await resp.json();
        return project;
      } catch (error) {
        console.error('Create project failed:', error);
        alert('创建失败，请重试');
      }
    }
    
    checkAuth();
    loadProjects();
    
    const projectsContainer = document.getElementById('projects-container');
    const createDialog = document.getElementById('create-dialog');
    const createForm = document.getElementById('create-form');
    let projectStatusFilter = 'all';
    
    function renderProjects(projects) {
      const filteredProjects = projects.filter(project => (
        projectStatusFilter === 'all' || (project.status || 'active') === projectStatusFilter
      ));
      if (filteredProjects.length === 0) {
        projectsContainer.innerHTML = `
          <div class="empty-state">
            <h2>${projects.length ? '没有符合筛选条件的旅程' : '还没有旅行项目'}</h2>
            <p>${projects.length ? '切换筛选条件，或将项目标记为已完成。' : '创建你的第一个旅行项目，开始规划精彩旅程'}</p>
            ${projects.length ? '' : '<button class="button button-ink" onclick="document.getElementById(\'create-dialog\').showModal()">+ 新建项目</button>'}
          </div>
        `;
        return;
      }
      
      projectsContainer.innerHTML = `
        <div class="project-grid">
          ${filteredProjects.map(p => `
            <div class="project-card" data-id="${p.id}">
              <div class="project-title-row"><h3>${escapeHtml(p.name)}</h3><span class="project-status ${p.status === 'completed' ? 'completed' : 'active'}">${p.status === 'completed' ? '已完成' : '进行中'}</span></div>
              <div class="project-meta">
                ${p.mode === 'hiking' ? '<span>🥾 徒步路线</span>' : ''}
                ${p.destination ? `<span>📍 ${escapeHtml(p.destination)}</span>` : ''}
                ${p.startDate ? `<span>📅 ${p.startDate} ~ ${p.endDate || '...'}</span>` : ''}
              </div>
              ${p.description ? `<div class="project-desc">${escapeHtml(p.description)}</div>` : ''}
              <div class="project-stats">
                <div class="stat">
                  <span class="stat-value">${p.data?.blocks?.length || 0}</span>
                  <span>旅行块</span>
                </div>
                <div class="stat">
                  <span class="stat-value">${p.members?.length || 0}</span>
                  <span>成员</span>
                </div>
                <div class="stat">
                  <span class="stat-value">${p.mode === 'hiking' ? (p.data?.hikingRoute?.start && p.data?.hikingRoute?.end ? 2 : 0) : (p.data?.timeline?.length || 0)}</span>
                  <span>${p.mode === 'hiking' ? '路线点' : '行程项'}</span>
                </div>
              </div>
              <div class="project-card-actions">
                <button class="manage-members-btn" data-id="${p.id}" data-name="${escapeHtml(p.name)}">管理成员</button>
                <button class="toggle-project-status-btn" data-id="${p.id}" data-revision="${p.revision || 1}" data-status="${p.status || 'active'}">${p.status === 'completed' ? '重新开启' : '标记完成'}</button>
                <button class="enter-project-btn" data-id="${p.id}">进入项目</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      
      // 绑定进入项目按钮
      document.querySelectorAll('.enter-project-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const projectId = btn.dataset.id;
          localStorage.setItem('currentProjectId', projectId);
          window.location.href = 'index.html';
        });
      });
      
      // 绑定管理成员按钮
      document.querySelectorAll('.manage-members-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const projectId = btn.dataset.id;
          const projectName = btn.dataset.name;
          await openMembersDialog(projectId, projectName);
        });
      });

      document.querySelectorAll('.toggle-project-status-btn').forEach(btn => {
        btn.addEventListener('click', async (event) => {
          event.stopPropagation();
          const nextStatus = btn.dataset.status === 'completed' ? 'active' : 'completed';
          const resp = await fetch(`${API_BASE}/api/projects/${btn.dataset.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ status: nextStatus, expectedRevision: Number(btn.dataset.revision) }),
          });
          if (!resp.ok) {
            alert('更新旅程状态失败，请刷新后重试。');
            return;
          }
          loadProjects();
        });
      });
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    document.getElementById('create-btn').addEventListener('click', () => {
      createDialog.showModal();
    });
    
    document.getElementById('cancel-btn').addEventListener('click', () => {
      createDialog.close();
    });

    document.querySelectorAll('[data-project-status]').forEach(button => {
      button.addEventListener('click', () => {
        projectStatusFilter = button.dataset.projectStatus;
        document.querySelectorAll('[data-project-status]').forEach(item => {
          item.classList.toggle('active', item === button);
        });
        loadProjects();
      });
    });
    
    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const project = await createProject({
        name: document.getElementById('project-name').value.trim(),
        mode: document.getElementById('project-mode').value
      });
      
      if (project) {
        createDialog.close();
        createForm.reset();
        loadProjects();
      }
    });
    
    // 成员管理相关
    const membersDialog = document.getElementById('members-dialog');
    const membersList = document.getElementById('members-list');
    const membersProjectName = document.getElementById('members-project-name');
    let currentManageProjectId = null;
    
    // 打开成员管理弹窗
    async function openMembersDialog(projectId, projectName) {
      currentManageProjectId = projectId;
      membersProjectName.textContent = projectName;
      membersDialog.showModal();
      await loadMembers(projectId);
    }
    
    // 加载成员列表
    async function loadMembers(projectId) {
      try {
        const resp = await fetch(`${API_BASE}/api/projects/${projectId}/members`, {
          credentials: 'include'
        });
        
        if (!resp.ok) {
          throw new Error('加载成员失败');
        }
        
        const data = await resp.json();
        renderMembers(data.members);
      } catch (error) {
        console.error('Load members failed:', error);
        membersList.innerHTML = '<div class="empty-state">加载成员失败</div>';
      }
    }
    
    // 渲染成员列表
    function renderMembers(members) {
      if (members.length === 0) {
        membersList.innerHTML = '<div class="empty-state">暂无成员</div>';
        return;
      }
      
      membersList.innerHTML = members.map(member => `
        <div class="member-item" data-user-id="${member.userId}">
          <div class="member-avatar">${member.displayName.charAt(0).toUpperCase()}</div>
          <div class="member-info">
            <div class="member-name">${escapeHtml(member.displayName)} <small style="color: var(--muted);">@${escapeHtml(member.username)}</small></div>
            <div class="member-role">${getRoleName(member.role)}</div>
          </div>
          <div class="member-actions">
            <select class="role-select" data-user-id="${member.userId}">
              <option value="owner" ${member.role === 'owner' ? 'selected' : ''}>所有者</option>
              <option value="editor" ${member.role === 'editor' ? 'selected' : ''}>编辑者</option>
              <option value="viewer" ${member.role === 'viewer' ? 'selected' : ''}>查看者</option>
            </select>
            <button class="remove-member-btn" data-user-id="${member.userId}">移除</button>
          </div>
        </div>
      `).join('');
      
      // 绑定角色修改事件
      document.querySelectorAll('.role-select').forEach(select => {
        select.addEventListener('change', async (e) => {
          const userId = e.target.dataset.userId;
          const newRole = e.target.value;
          await updateMemberRole(userId, newRole);
        });
      });
      
      // 绑定移除成员事件
      document.querySelectorAll('.remove-member-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const userId = e.target.dataset.userId;
          if (confirm('确定要移除这个成员吗？')) {
            await removeMember(userId);
          }
        });
      });
    }
    
    // 获取角色名称
    function getRoleName(role) {
      const roles = {
        owner: '所有者',
        editor: '编辑者',
        viewer: '查看者'
      };
      return roles[role] || role;
    }
    
    // 邀请成员
    document.getElementById('invite-btn').addEventListener('click', async () => {
      const username = document.getElementById('invite-username').value.trim();
      const role = document.getElementById('invite-role').value;
      
      if (!username) {
        alert('请输入用户名');
        return;
      }
      
      try {
        // 先获取用户 ID
        const usersResp = await fetch(`${API_BASE}/api/users`, {
          credentials: 'include'
        });
        const usersData = await usersResp.json();
        const user = usersData.users.find(u => u.username === username);
        
        if (!user) {
          alert('用户不存在');
          return;
        }
        
        // 邀请成员
        const resp = await fetch(`${API_BASE}/api/projects/${currentManageProjectId}/invite`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            userId: user.id,
            role: role
          })
        });
        
        if (!resp.ok) {
          const error = await resp.json();
          throw new Error(error.error || '邀请失败');
        }
        
        alert('邀请成功！');
        document.getElementById('invite-username').value = '';
        await loadMembers(currentManageProjectId);
        loadProjects(); // 刷新项目列表以更新成员数
      } catch (error) {
        console.error('Invite failed:', error);
        alert(error.message);
      }
    });
    
    // 修改成员角色
    async function updateMemberRole(userId, newRole) {
      try {
        const resp = await fetch(`${API_BASE}/api/projects/${currentManageProjectId}/members/${userId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ role: newRole })
        });
        
        if (!resp.ok) {
          const error = await resp.json();
          throw new Error(error.error || '修改角色失败');
        }
        
        alert('角色已更新');
        await loadMembers(currentManageProjectId);
      } catch (error) {
        console.error('Update role failed:', error);
        alert(error.message);
        await loadMembers(currentManageProjectId); // 恢复原状
      }
    }
    
    // 移除成员
    async function removeMember(userId) {
      try {
        const resp = await fetch(`${API_BASE}/api/projects/${currentManageProjectId}/members/${userId}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        
        if (!resp.ok) {
          const error = await resp.json();
          throw new Error(error.error || '移除失败');
        }
        
        alert('成员已移除');
        await loadMembers(currentManageProjectId);
        loadProjects(); // 刷新项目列表以更新成员数
      } catch (error) {
        console.error('Remove member failed:', error);
        alert(error.message);
      }
    }
    
    // 关闭成员管理弹窗
    document.getElementById('close-members-btn').addEventListener('click', () => {
      membersDialog.close();
    });
  </script>
</body>
</html>
