    // Render vacation cards
    const grid = document.getElementById('vacation-grid');

    vacationSpots.forEach((spot, index) => {
      const card = document.createElement('div');
      card.className = 'vacation-card';
      card.innerHTML = `
        <div class="vacation-card-header">
          <h3 class="vacation-card-title">${spot.title}</h3>
          <div class="vacation-card-meta">
            <span>📅 ${spot.date}</span>
            <span>❤️ ${spot.likes || '1'}</span>
          </div>
        </div>
        <div class="vacation-card-body">
          <p class="vacation-card-desc">${spot.desc}</p>
          <div class="vacation-card-tags">
            ${(spot.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        </div>
        <div class="vacation-card-footer">
          <div class="author">
            <div class="author-avatar">${spot.author[0]}</div>
            <span>${spot.author}</span>
          </div>
          <a class="view-on-xhs" href="https://www.xiaohongshu.com/explore/${spot.id}" target="_blank">
            查看原文 →
          </a>
        </div>
      `;

      card.addEventListener('click', () => openModal(spot));
      grid.appendChild(card);
    });

    // Modal functionality
    const modal = document.getElementById('vacation-modal');
    const modalClose = document.getElementById('modal-close');

    function openModal(spot) {
      document.getElementById('modal-title').textContent = spot.title;
      document.getElementById('modal-author').textContent = `@${spot.author}`;
      document.getElementById('modal-date').textContent = spot.date;
      document.getElementById('modal-desc').textContent = spot.desc;
      document.getElementById('modal-link').href = `https://www.xiaohongshu.com/explore/${spot.id}`;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
